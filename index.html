<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ぽぽのホームページ</title>

  <style>
    body {
      background-color: #c0c0c0;
      font-family: "MS PGothic", "ＭＳ Ｐゴシック", sans-serif;
      padding: 20px;
      color: black;
      text-align: center;
      padding-bottom: 50px;
    }

    h1 {
      font-size: 36px;
      font-family: "MS PGothic", "ＭＳ Ｐゴシック", sans-serif;
      color: #000080;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .window {
      width: 320px;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: 1px 1px 0 #000000;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }

    .title-bar {
      background: linear-gradient(to right, #000080, #1084d0);
      color: white;
      font-weight: bold;
      font-size: 14px;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-buttons {
      display: flex;
      gap: 2px;
    }

    .title-button {
      width: 16px;
      height: 14px;
      background-color: #c0c0c0;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      font-size: 10px;
      line-height: 12px;
      text-align: center;
      color: black;
    }

    .window-content {
      padding: 12px;
      background-color: #c0c0c0;
      border-top: 2px solid #808080;
    }

    .window-content ul {
      margin: 0;
      padding-left: 20px;
    }

    .window-content li {
      margin-bottom: 8px;
    }

    .window-content a {
      color: #0000ee;
    }

    .window-content a:visited {
      color: #551a8b;
    }

    .subtitle {
      text-align: center;
      color: #800080;
      font-size: 14px;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .diary-window {
      width: 500px;
      margin-top: 20px;
    }

    .diary-content {
      background-color: #ffffff;
      font-family: "MS Gothic", "ＭＳ ゴシック", monospace;
      line-height: 1.7;
    }

    .diary-date {
      font-weight: bold;
      color: #000080;
      margin-bottom: 5px;
    }

    .diary-content hr {
      border: 0;
      border-top: 1px dashed #808080;
      margin: 18px 0;
    }

    .marquee-box {
      width: 500px;
      background-color: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 4px;
      margin: 0 auto 20px auto;
    }

    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;

      text-align: center;
      font-size: 12px;
      color: #404040;

      padding: 8px 0;
      background-color: #c0c0c0;

      z-index: 9999;
    }
  
  </style>
</head>

<body>

  <h1>★★ ぽぽのホームページ ★★</h1>
  <p class="subtitle">~popo's homepage~</p>

  <div class="marquee-box">
    <marquee scrollamount="4">
      ★ ゆっくりしていってね！ ★
    </marquee>
  </div>

  <div class="window">
    <div class="title-bar">
      <span>リンク集</span>
      <div class="title-buttons">
        <div class="title-button">―</div>
        <div class="title-button">□</div>
        <div class="title-button">×</div>
      </div>
    </div>

    <div class="window-content">
      <ul>
        <li><a href="https://x.com/ppboy0s" target="_blank">X</a></li>
        <li><a href="https://www.twitch.tv/ppboy0s" target="_blank">Twitch</a></li>
      </ul>
    </div>
  </div>

  <div class="window diary-window">
  <div class="title-bar">
    <span>日記.txt - メモ帳</span>

    <div class="title-buttons">
      <div class="title-button">―</div>
      <div class="title-button">□</div>
      <div class="title-button">×</div>
    </div>
  </div>

  <div class="window-content diary-content">

    <p class="diary-date">2026/09/28</p>
    <p>
      ホームページ作ったヨ！(^^)/<br>
    </p>

    <hr>

  </div>
</div>

<footer class="footer">
  <p>Since 2026.09.28</p>
</footer>

</body>


</html>
