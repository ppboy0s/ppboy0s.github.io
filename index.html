<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ぽぽのホームページ</title>

  <link rel="stylesheet" href="css/style.css">
</head>


<body>

  <!-- =========================
       ページタイトル
  ========================== -->

  <h1>
    ★★ ぽぽのホームページ ★★
  </h1>

  <p class="subtitle">
    ~popo's homepage~
  </p>


  <!-- =========================
       流れる文字
  ========================== -->

  <div class="marquee-box">
    <marquee scrollamount="4">
      ★★ ゆっくりしていってね！(*‘ω‘ *) (*‘ω‘ *)★★
    </marquee>
  </div>


<table align="center" cellspacing="20">
  <tr>

    <td valign="top">
      <div id="clock-component"></div>
      <br>
      <div id="photo-component"></div>
      <br>
      <div id="links-component"></div>
    </td>

    <td valign="top">
      <div id="counter-component"></div>
      <br>
      <div id="diary-component"></div>
    </td>

  </tr>
</table>


  <!-- =========================
       フッター
  ========================== -->

  <footer class="footer">
    <p>Since 2026.09.28</p>
  </footer>


  <!-- =========================
       データ
  ========================== -->

  <script src="data/diary-data.js"></script>
  <script src="data/photo-data.js"></script>


  <!-- =========================
       JavaScript
  ========================== -->

  <script src="js/window.js"></script>
  <script src="js/diary.js"></script>
  <script src="js/photo.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/counter.js"></script>


  <!-- コンポーネントは最後に読み込む -->
  <script src="js/components.js"></script>


  <!-- =========================
       GoatCounter
  ========================== -->

  <script
    data-goatcounter="https://ppboy.goatcounter.com/count"
    data-goatcounter-settings='{"allow_local": true}'
    async
    src="//gc.zgo.at/count.js">
  </script>

</body>

</html>
